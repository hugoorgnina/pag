<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#2f7fd6" />
    <title>Pip: Aventura Estelar</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap" />
  </head>
  <body>
    <canvas id="game"></canvas>

    <div id="hud" class="hidden">
      <div class="hud-row">
        <div class="stat"><span class="icon icon-pip"></span>×<span id="lives">4</span></div>
        <div class="stat"><span class="icon icon-star">★</span>×<span id="star-count">0</span></div>
        <div class="stat"><span class="icon icon-coin"></span>×<span id="coin-count">0</span></div>
      </div>
      <div class="hud-right">
        <canvas id="power" width="96" height="96" aria-label="Salud"></canvas>
        <button class="quality" type="button" title="Cambiar calidad (Q)">Calidad: <span id="quality-label">Alta</span></button>
      </div>
      <div id="course-name"></div>
    </div>

    <div id="red-counter"></div>
    <div id="toast"></div>
    <div id="fade"></div>
    <pre id="debug" hidden></pre>

    <div id="overlay">
      <div class="panel">
        <h1 id="overlay-title">Pip: Aventura Estelar</h1>
        <div id="overlay-text"></div>
        <div class="buttons">
          <button id="overlay-button" type="button">Jugar</button>
          <button id="overlay-secondary" type="button" hidden>Volver</button>
        </div>
      </div>
    </div>

    <div id="touch-controls" hidden>
      <div id="look-pad"></div>
      <div id="stick"><div id="stick-knob"></div></div>
      <button id="btn-crouch" type="button" aria-label="Agacharse / culatazo">Z</button>
      <button id="btn-attack" type="button" aria-label="Puñetazo / plancha">B</button>
      <button id="btn-jump" type="button" aria-label="Saltar">A</button>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
